{% extends "base.html" %}
{% block content %}
<section class="login-form">
  <header>
    <h1>{{ app_name }}</h1>
    <p>登录工作台</p>
  </header>
  <form method="post" class="form-grid">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>用户名<input required name="username" value="{{ username|default('') }}" autocomplete="username" maxlength="48"></label>
    <label>密码<input required type="password" name="password" autocomplete="current-password" maxlength="128"></label>
    <div><button type="submit">登录</button></div>
  </form>
  <p class="demo-note">课程设计演示 · 页面中的人物与业务记录均为虚构</p>
</section>
{% endblock %}
